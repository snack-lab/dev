name: dev
base: ubuntu@24.04
sdks:
    - name: project-base
    - name: vscode-remote
    - name: ollama
      channel: latest/stable
    - name: node
      channel: 24/stable
    # - name: rust
    #   channel: latest/stable

actions:
    # build: cargo build "$@"
    # doc: cargo doc "$@"
    # lint: cargo clippy "$@"
    # test: cargo test "$@"
    pull: |
        ollama pull "$@"
    run: |
        ollama run "$@"
    install: |
        npm install
    test: |
        npm test
